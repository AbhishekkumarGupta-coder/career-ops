# Career-Ops Portal Configuration
# Copy this to portals.yml and customize for your job search

# Job title keyword filters
title_filter:
  positive:
    - "AI"
    - "ML"
    - "machine learning"
    - "LLM"
    - "applied AI"
    - "engineer"
    - "scientist"
  negative:
    - "intern"
    - "junior"
    - "VP"
    - "C-level"
    - "director"
    - "Head of"

# Search queries for job boards
search_queries:
  - "AI engineer site:greenhouse.io"
  - "machine learning engineer site:lever.co"
  - "applied AI site:ashbyhq.com"
  - "LLM engineer site:wellfound.com"
  - "AI product manager remote"

# Company career pages to scan directly
companies:
  # AI Labs
  - name: "Anthropic"
    url: "https://www.anthropic.com/careers"
  - name: "OpenAI"
    url: "https://openai.com/careers"
  - name: "Mistral"
    url: "https://mistral.ai/careers"
  - name: "Cohere"
    url: "https://cohere.com/careers"

  # Voice AI
  - name: "ElevenLabs"
    url: "https://elevenlabs.io/careers"
  - name: "Deepgram"
